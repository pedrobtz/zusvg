on:
  push:
    branches: [main, master]
  # `labeled` so that adding `full-ci` to a pull request reruns it in full.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

name: R-CMD-check

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# get a group of their own, so every merge is checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@bdfde5edd37f25b33af142a4a881585e77bda3c2 # v1.22.0
    with:
      # Quick on each push to a pull request, full after merge. The
      # `full-ci` label runs the full set on a pull request before merging.
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}
      # The default runners plus Windows on R-devel: the containers job is
      # R-devel on Linux, and no other leg is the combination CRAN's incoming
      # pretest runs (r-devel-windows-x86_64).
      # CRAN's NOSUGGESTS and NOLD flavors, both off by default; full
      # profile only.
      nosuggests: true
      nold: true
      runners: >-
        [{"os": "macos-latest", "r": "release"},
         {"os": "windows-latest", "r": "release"},
         {"os": "windows-latest", "r": "devel"},
         {"os": "ubuntu-latest", "r": "release"},
         {"os": "ubuntu-latest", "r": "oldrel-1"}]
