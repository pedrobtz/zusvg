# The C boundary is where this package has to be strict: it vendors a C
# renderer and points it at untrusted input. These jobs make the robustness
# claims testable rather than asserted (.agents/design.md §12, §15).
on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

name: native-checks

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # -UNDEBUG keeps the vendored assert()s in under UBSan, so a violated
  # precondition aborts the job instead of being silent undefined behaviour.
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@bdfde5edd37f25b33af142a4a881585e77bda3c2 # v1.22.0
    with:
      asan: true
      extra-ubsan-checks: -UNDEBUG
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@bdfde5edd37f25b33af142a4a881585e77bda3c2 # v1.22.0
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@bdfde5edd37f25b33af142a4a881585e77bda3c2 # v1.22.0

  # ZUSVG_SKIP_HEAVY skips the tests that load thousands of documents: they
  # check memory and limits, not PROTECT discipline.
  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@bdfde5edd37f25b33af142a4a881585e77bda3c2 # v1.22.0
    with:
      profile: ${{ github.event_name == 'pull_request' && 'quick' || 'full' }}
      timeout-minutes: 240
      env: |
        ZUSVG_SKIP_HEAVY=true

  # Blocking from the first run: the C code is new, so any finding is ours.
  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@bdfde5edd37f25b33af142a4a881585e77bda3c2 # v1.22.0
    with:
      fail-on-findings: true
      github-packages: |
        pedrobtz/zufast
